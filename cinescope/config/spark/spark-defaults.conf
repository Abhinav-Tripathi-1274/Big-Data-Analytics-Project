# CineScope: one physical master and two physical YARN workers.
spark.master                      yarn
spark.submit.deployMode           client

# The Spark driver runs on the physical master.
spark.driver.host                 master
spark.driver.bindAddress          0.0.0.0
spark.driver.port                 7078

# Executor block managers listen on the workers; the driver's block
# manager also uses this configured base port on the master.
spark.blockManager.port           7079
spark.port.maxRetries             20

# Dashboard and history service.
spark.ui.port                     4040
spark.history.ui.port             18080
spark.eventLog.enabled            true
spark.eventLog.dir                hdfs://master:8020/spark-logs
spark.history.fs.logDirectory     hdfs://master:8020/spark-logs

# Small-cluster resource requests. Adjust YARN worker memory first
# if the physical workers do not have sufficient available RAM.
spark.driver.memory               1g
spark.executor.instances          2
spark.executor.cores              1
spark.executor.memory              1g
spark.executor.memoryOverhead     384m
spark.yarn.am.memory              512m
spark.yarn.am.memoryOverhead      384m

# Each worker must provide this Python executable.
spark.pyspark.python              /usr/bin/python3

# Spark 3.5.9 JAR archive; must match the installed Spark version.
spark.yarn.archive                hdfs://master:8020/spark-archive/spark-libs-3.5.9.zip

spark.sql.shuffle.partitions      16
spark.sql.session.timeZone        UTC
